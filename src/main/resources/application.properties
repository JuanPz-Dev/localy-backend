spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

logging.level.org.springframework.security=DEBUG

spring.datasource.url=${LOCALY_DB_URL}
spring.datasource.username=${LOCALY_DB_USERNAME}
spring.datasource.password=${LOCALY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#comision
localy.commission.rate=0.10

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

localy.seed.tour-services.image-dir=${LOCALY_SEED_IMAGE_DIR:seed-assets}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=7200000

#Tamaño de las fotos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

GEMINI_API_KEY=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent

# Servicio independiente de predicción de Localy
localy.ml.base-url=http://localhost:8000